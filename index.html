<!DOCTYPE html>
<html>
<head>
  <title>Braiswick Memory Cards</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  
  <!-- Import libraries -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image.prod.js"></script>
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
  <!-- Add jsPDF for PDF generation -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: fixed;
      font-family: 'Arial', sans-serif;
    }
    
    /* Splash Screen */
    #splash-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #a6b4a4;
      z-index: 20000;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: opacity 0.8s ease;
    }
    
    #splash-screen.fade-out {
      opacity: 0;
      pointer-events: none;
    }
    
    .splash-logo {
      width: 280px;
      height: auto;
      animation: fadeInScale 1.2s ease-out;
    }
    
    @keyframes fadeInScale {
      0% {
        opacity: 0;
        transform: scale(0.9);
      }
      100% {
        opacity: 1;
        transform: scale(1);
      }
    }
    
    /* Camera permission button overlay */
    #camera-prompt {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #a6b4a4;
      z-index: 10000;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    
    .camera-prompt-content {
      text-align: center;
      max-width: 400px;
      padding: 20px;
    }
    
    .prompt-logo {
      width: 200px;
      height: auto;
      margin-bottom: 40px;
    }
    
    #camera-button {
      background: #2c3e2f;
      color: white;
      border: none;
      padding: 18px 50px;
      border-radius: 50px;
      font-size: 18px;
      font-weight: 500;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 10px 20px rgba(0,0,0,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      margin-top: 20px;
    }
    
    #camera-button:hover {
      background: #1e2b20;
      transform: translateY(-2px);
      box-shadow: 0 15px 30px rgba(0,0,0,0.15);
    }
    
    #camera-button:active {
      transform: translateY(0);
    }
    
    #permission-status {
      margin-top: 20px;
      color: #2c3e2f;
      font-size: 14px;
      font-weight: 500;
      opacity: 0.8;
    }
    
    .prompt-message {
      color: #2c3e2f;
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 20px;
      font-weight: 400;
      opacity: 0.9;
    }
    
    /* AR Scene */
    a-scene {
      position: absolute !important;
      top: 0 !important;
      left: 0 !important;
      width: 100% !important;
      height: 100% !important;
      z-index: 1 !important;
      display: block !important;
      opacity: 0;
      transition: opacity 0.5s;
    }
    
    a-scene.visible {
      opacity: 1;
    }
    
    /* UI Overlay */
    #ui-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1000;
      pointer-events: none;
    }
    
    .scan-container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 280px;
      height: 280px;
      z-index: 1001;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .scan-box {
      width: 100%;
      height: 100%;
      border: 2px solid rgba(255, 255, 255, 0.8);
      border-radius: 24px;
      box-shadow: 0 0 0 1000px rgba(0, 0, 0, 0.5);
      transition: all 0.3s ease;
    }
    
    .scan-box.detected {
      border-color: #a6b4a4;
      box-shadow: 0 0 30px #a6b4a4, 0 0 0 1000px rgba(166, 180, 164, 0.1);
    }
    
    /* Memory Card Modal */
    #memory-card-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 5000;
      display: none;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      align-items: center;
      justify-content: center;
      pointer-events: auto;
    }
    
    .memory-card-container {
      width: 320px;
      height: 500px;
      perspective: 1500px;
      cursor: pointer;
    }
    
    .memory-card {
      position: relative;
      width: 100%;
      height: 100%;
      text-align: center;
      transition: transform 0.8s;
      transform-style: preserve-3d;
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
    }
    
    .memory-card.flipped {
      transform: rotateY(180deg);
    }
    
    .card-front, .card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 24px;
      overflow: hidden;
    }
    
    .card-front {
      background: linear-gradient(145deg, #ffffff 0%, #f5f5f5 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    
    .portrait-frame {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      overflow: hidden;
      border: 4px solid #a6b4a4;
      margin-bottom: 30px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.1);
    }
    
    .portrait-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    
    .view-memory-btn {
      background: #2c3e2f;
      color: white;
      border: none;
      padding: 15px 40px;
      border-radius: 50px;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 10px 20px rgba(0,0,0,0.1);
      border: 1px solid rgba(255,255,255,0.2);
    }
    
    .view-memory-btn:hover {
      background: #1e2b20;
      transform: translateY(-2px);
      box-shadow: 0 15px 30px rgba(0,0,0,0.15);
    }
    
    .card-back {
      background: linear-gradient(135deg, #a6b4a4 0%, #8a9a87 100%);
      transform: rotateY(180deg);
      padding: 25px;
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    
    .memory-header {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 20px;
      border-bottom: 2px solid rgba(255,255,255,0.3);
      padding-bottom: 10px;
    }
    
    .memory-details {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 20px;
      justify-content: center;
    }
    
    .memory-item {
      text-align: left;
    }
    
    .memory-label {
      font-size: 14px;
      opacity: 0.8;
      margin-bottom: 5px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    
    .memory-value {
      font-size: 20px;
      font-weight: 600;
      line-height: 1.4;
    }
    
    .memory-footer {
      font-size: 12px;
      opacity: 0.6;
      margin-top: 20px;
      font-style: italic;
    }
    
    /* Download Button */
    #download-btn-container {
      position: absolute;
      bottom: 30px;
      left: 30px;
      z-index: 2000;
      pointer-events: auto;
    }
    
    .download-btn {
      background: #2c3e2f;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 50px;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
      border: 1px solid rgba(255,255,255,0.2);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .download-btn:hover {
      background: #1e2b20;
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(0,0,0,0.25);
    }
    
    .download-btn:active {
      transform: translateY(0);
    }
    
    .download-icon {
      font-size: 18px;
    }
    
    #close-modal-btn {
      position: absolute;
      top: 50px;
      right: 20px;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: white;
      font-size: 30px;
      line-height: 1;
      cursor: pointer;
      pointer-events: auto;
      transition: all 0.3s ease;
      z-index: 5001;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(5px);
    }
    
    #close-modal-btn:hover {
      background: rgba(255, 255, 255, 0.3);
      transform: scale(1.1);
    }
    
    /* Loading indicator */
    #loading {
      position: fixed;
      bottom: 30px;
      right: 30px;
      color: rgba(255, 255, 255, 0.7);
      font-size: 12px;
      letter-spacing: 0.5px;
      z-index: 10000;
      text-transform: uppercase;
    }
    
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.02); }
      100% { transform: scale(1); }
    }
    
    .pulse {
      animation: pulse 1s ease-in-out;
    }
  </style>
</head>
<body>
  <!-- Splash Screen -->
  <div id="splash-screen">
    <img src="https://static.wixstatic.com/media/42e05c_12592fc2a93e4bf0b1e30417fc3a3694~mv2.png" alt="Braiswick" class="splash-logo">
  </div>

  <!-- Camera Permission Prompt -->
  <div id="camera-prompt">
    <div class="camera-prompt-content">
      <img src="https://static.wixstatic.com/media/42e05c_12592fc2a93e4bf0b1e30417fc3a3694~mv2.png" alt="Braiswick" class="prompt-logo">
      <div class="prompt-message">Enable camera access to discover memories</div>
      <button id="camera-button">Continue</button>
      <div id="permission-status"></div>
    </div>
  </div>

  <!-- Download Button -->
  <div id="download-btn-container">
    <button class="download-btn" id="downloadBookletBtn">
      <span class="download-icon">📖</span>
      <span>Download Memory Booklet</span>
    </button>
  </div>

  <!-- Memory Card Modal -->
  <div id="memory-card-modal">
    <div class="memory-card-container" id="memoryCardContainer">
      <div class="memory-card" id="memoryCard">
        <div class="card-front">
          <div class="portrait-frame">
            <img src="https://static.wixstatic.com/media/42e05c_12592fc2a93e4bf0b1e30417fc3a3694~mv2.png" alt="Portrait" id="studentPortrait">
          </div>
          <button class="view-memory-btn" id="viewMemoryBtn">View Memory</button>
        </div>
        <div class="card-back">
          <div class="memory-header">2024 Memories</div>
          <div class="memory-details">
            <div class="memory-item">
              <div class="memory-label">Favorite Thing This Year</div>
              <div class="memory-value" id="favoriteThing">Art Class</div>
            </div>
            <div class="memory-item">
              <div class="memory-label">Favorite Subject</div>
              <div class="memory-value" id="favoriteSubject">Science</div>
            </div>
            <div class="memory-item">
              <div class="memory-label">Favorite Teacher</div>
              <div class="memory-value" id="favoriteTeacher">Mrs. Smith</div>
            </div>
            <div class="memory-item">
              <div class="memory-label">Best Friend</div>
              <div class="memory-value" id="bestFriend">Alex</div>
            </div>
          </div>
          <div class="memory-footer">Braiswick • Class of 2024</div>
        </div>
      </div>
    </div>
    <button id="close-modal-btn">✕</button>
  </div>

  <!-- AR Scene - Photo Target (photo.mind) -->
  <a-scene
    id="scene-photo"
    mindar-image="imageTargetSrc: ./photo.mind; autoStart: true; uiLoading: no; uiError: no; uiScanning: no;"
    color-space="sRGB"
    embedded
    renderer="colorManagement: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    style="display: none;">
    
    <a-camera id="camera-photo" position="0 0 0" look-controls="enabled: false"></a-camera>
    
    <!-- Photo Target -->
    <a-entity id="photo-target" mindar-image-target="targetIndex: 0">
      <!-- Invisible trigger element -->
      <a-plane
        width="2.0"
        height="1.33"
        position="0 0.5 0"
        rotation="0 0 0"
        material="transparent: true; opacity: 0;">
      </a-plane>
    </a-entity>
  </a-scene>

  <!-- AR Scene - Image 1 Target (image1.mind) -->
  <a-scene
    id="scene-image1"
    mindar-image="imageTargetSrc: ./image1.mind; autoStart: true; uiLoading: no; uiError: no; uiScanning: no;"
    color-space="sRGB"
    embedded
    renderer="colorManagement: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    style="display: none;">
    
    <a-camera id="camera-image1" position="0 0 0" look-controls="enabled: false"></a-camera>
    
    <a-entity id="image1-target" mindar-image-target="targetIndex: 0">
      <a-plane
        width="2.0"
        height="1.33"
        position="0 0.5 0"
        rotation="0 0 0"
        material="transparent: true; opacity: 0;">
      </a-plane>
    </a-entity>
  </a-scene>

  <!-- AR Scene - Image 2 Target (image2.mind) -->
  <a-scene
    id="scene-image2"
    mindar-image="imageTargetSrc: ./image2.mind; autoStart: true; uiLoading: no; uiError: no; uiScanning: no;"
    color-space="sRGB"
    embedded
    renderer="colorManagement: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    style="display: none;">
    
    <a-camera id="camera-image2" position="0 0 0" look-controls="enabled: false"></a-camera>
    
    <a-entity id="image2-target" mindar-image-target="targetIndex: 0">
      <a-plane
        width="2.0"
        height="1.33"
        position="0 0.5 0"
        rotation="0 0 0"
        material="transparent: true; opacity: 0;">
      </a-plane>
    </a-entity>
  </a-scene>

  <!-- AR Scene - Image 4 Target (image4.mind) -->
  <a-scene
    id="scene-image4"
    mindar-image="imageTargetSrc: ./image4.mind; autoStart: true; uiLoading: no; uiError: no; uiScanning: no;"
    color-space="sRGB"
    embedded
    renderer="colorManagement: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    style="display: none;">
    
    <a-camera id="camera-image4" position="0 0 0" look-controls="enabled: false"></a-camera>
    
    <a-entity id="image4-target" mindar-image-target="targetIndex: 0">
      <a-plane
        width="2.0"
        height="1.33"
        position="0 0.5 0"
        rotation="0 0 0"
        material="transparent: true; opacity: 0;">
      </a-plane>
    </a-entity>
  </a-scene>

  <!-- UI Overlay -->
  <div id="ui-overlay">
    <div class="scan-container">
      <div class="scan-box" id="scanBox"></div>
    </div>
  </div>
  
  <div id="loading">initializing</div>

  <script>
    // UI Elements
    const splashScreen = document.getElementById('splash-screen');
    const scanBox = document.getElementById('scanBox');
    const loadingEl = document.getElementById('loading');
    const cameraPrompt = document.getElementById('camera-prompt');
    const cameraButton = document.getElementById('camera-button');
    const permissionStatus = document.getElementById('permission-status');
    
    // Memory Card Elements
    const memoryModal = document.getElementById('memory-card-modal');
    const memoryCard = document.getElementById('memoryCard');
    const viewMemoryBtn = document.getElementById('viewMemoryBtn');
    const closeModalBtn = document.getElementById('close-modal-btn');
    
    // Memory data elements
    const studentPortrait = document.getElementById('studentPortrait');
    const favoriteThing = document.getElementById('favoriteThing');
    const favoriteSubject = document.getElementById('favoriteSubject');
    const favoriteTeacher = document.getElementById('favoriteTeacher');
    const bestFriend = document.getElementById('bestFriend');
    
    // Download button
    const downloadBtn = document.getElementById('downloadBookletBtn');
    
    // Scene elements
    const photoScene = document.getElementById('scene-photo');
    const image1Scene = document.getElementById('scene-image1');
    const image2Scene = document.getElementById('scene-image2');
    const image4Scene = document.getElementById('scene-image4');
    const allScenes = [photoScene, image1Scene, image2Scene, image4Scene];
    
    // Memory data for different targets - linking .mind files to photos and student info
    const memoryData = {
      photo: {
        studentName: 'Student Name',
        portrait: 'https://static.wixstatic.com/media/42e05c_12592fc2a93e4bf0b1e30417fc3a3694~mv2.png',
        favoriteThing: 'Art Class',
        favoriteSubject: 'Science',
        favoriteTeacher: 'Mrs. Smith',
        bestFriend: 'Alex',
        mindFile: 'photo.mind',
        photoFile: 'photo1.jpg'
      },
      image1: {
        studentName: 'Emma',
        portrait: 'https://static.wixstatic.com/media/42e05c_12592fc2a93e4bf0b1e30417fc3a3694~mv2.png',
        favoriteThing: 'Music Lessons',
        favoriteSubject: 'Math',
        favoriteTeacher: 'Mr. Johnson',
        bestFriend: 'Olivia',
        mindFile: 'image1.mind',
        photoFile: 'photo1.jpg'
      },
      image2: {
        studentName: 'James',
        portrait: 'https://static.wixstatic.com/media/42e05c_12592fc2a93e4bf0b1e30417fc3a3694~mv2.png',
        favoriteThing: 'Sports Day',
        favoriteSubject: 'Physical Education',
        favoriteTeacher: 'Coach Roberts',
        bestFriend: 'William',
        mindFile: 'image2.mind',
        photoFile: 'photo2.jpg'
      },
      image4: {
        studentName: 'Sophie',
        portrait: 'https://static.wixstatic.com/media/42e05c_12592fc2a93e4bf0b1e30417fc3a3694~mv2.png',
        favoriteThing: 'Reading Time',
        favoriteSubject: 'English',
        favoriteTeacher: 'Ms. Davis',
        bestFriend: 'Isabella',
        mindFile: 'image4.mind',
        photoFile: 'photo4.jpg'
      }
    };
    
    let activeScene = 'photo';
    let targetFound = false;
    let cameraPermission = false;
    let currentTarget = 'photo';
    
    // Fade out splash screen
    setTimeout(() => {
      splashScreen.classList.add('fade-out');
    }, 2000);
    
    // Camera permission
    const isInIframe = window.self !== window.top;
    
    async function requestCameraPermission() {
      permissionStatus.innerHTML = 'Requesting camera access...';
      cameraButton.disabled = true;
      cameraButton.innerHTML = 'Requesting...';
      
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ 
          video: {
            width: { ideal: 1280 },
            height: { ideal: 720 },
            facingMode: 'environment'
          },
          audio: false 
        });
        
        // Stop all tracks immediately - we just needed permission
        stream.getTracks().forEach(track => track.stop());
        
        cameraPermission = true;
        cameraPrompt.style.display = 'none';
        
        // Show all scenes
        allScenes.forEach(scene => {
          scene.classList.add('visible');
        });
        
        loadingEl.innerHTML = 'scanning';
        
        return true;
        
      } catch (error) {
        console.error('Camera error:', error);
        
        let userMessage = error.name === 'NotAllowedError' 
          ? 'Camera access required. Please enable and try again.'
          : 'Unable to access camera. Please try again.';
        
        permissionStatus.innerHTML = userMessage;
        cameraButton.disabled = false;
        cameraButton.innerHTML = 'Try Again';
        
        return false;
      }
    }
    
    cameraButton.addEventListener('click', requestCameraPermission);
    
    if (!isInIframe) {
      setTimeout(requestCameraPermission, 2500);
    }
    
    // Function to update memory card with target data
    function updateMemoryCard(target) {
      const data = memoryData[target] || memoryData.photo;
      studentPortrait.src = data.portrait;
      favoriteThing.textContent = data.favoriteThing;
      favoriteSubject.textContent = data.favoriteSubject;
      favoriteTeacher.textContent = data.favoriteTeacher;
      bestFriend.textContent = data.bestFriend;
    }
    
    // Function to show memory modal
    function showMemoryModal(target) {
      if (memoryModal.style.display === 'flex') return;
      
      updateMemoryCard(target);
      currentTarget = target; // Set current target for download button
      memoryModal.style.display = 'flex';
      
      // Reset card to front
      memoryCard.classList.remove('flipped');
      
      // Add pulse animation to scan box
      scanBox.classList.add('detected');
      scanBox.classList.add('pulse');
    }
    
    // Function to hide memory modal
    function hideMemoryModal() {
      memoryModal.style.display = 'none';
      memoryCard.classList.remove('flipped');
    }
    
    // Close modal button
    closeModalBtn.addEventListener('click', hideMemoryModal);
    
    // Click on modal background to close
    memoryModal.addEventListener('click', (e) => {
      if (e.target === memoryModal) {
        hideMemoryModal();
      }
    });
    
    // View Memory button click - flips the card
    viewMemoryBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      memoryCard.classList.add('flipped');
    });
    
    // Click on card to flip back
    memoryCard.addEventListener('click', () => {
      memoryCard.classList.toggle('flipped');
    });
    
    // Scene event listeners
    function setupSceneListeners(scene, targetName) {
      scene.addEventListener('targetFound', () => {
        console.log(`Target found: ${targetName}`);
        targetFound = true;
        showMemoryModal(targetName);
      });
      
      scene.addEventListener('targetLost', () => {
        console.log(`Target lost: ${targetName}`);
        if (memoryModal.style.display !== 'flex') {
          targetFound = false;
          scanBox.classList.remove('detected');
          scanBox.classList.remove('pulse');
        }
      });
      
      scene.addEventListener('error', (error) => {
        console.error(`Error with ${targetName} scene:`, error);
      });
    }
    
    // Setup all scenes
    setupSceneListeners(photoScene, 'photo');
    setupSceneListeners(image1Scene, 'image1');
    setupSceneListeners(image2Scene, 'image2');
    setupSceneListeners(image4Scene, 'image4');
    
    // Track when scenes are loaded
    photoScene.addEventListener('loaded', () => {
      console.log('Photo scene loaded');
      loadingEl.innerHTML = 'ready';
    });
    
    // Scene cycling - only show one scene at a time for better performance
    let sceneIndex = 0;
    const scenes = ['photo', 'image1', 'image2', 'image4'];
    
    function setActiveScene(sceneName) {
      if (memoryModal.style.display === 'flex') return;
      
      // Hide all scenes
      photoScene.style.display = 'none';
      image1Scene.style.display = 'none';
      image2Scene.style.display = 'none';
      image4Scene.style.display = 'none';
      
      // Show the active scene
      if (sceneName === 'photo') {
        photoScene.style.display = 'block';
        activeScene = 'photo';
        console.log('Active scene: photo');
      } else if (sceneName === 'image1') {
        image1Scene.style.display = 'block';
        activeScene = 'image1';
        console.log('Active scene: image1');
      } else if (sceneName === 'image2') {
        image2Scene.style.display = 'block';
        activeScene = 'image2';
        console.log('Active scene: image2');
      } else if (sceneName === 'image4') {
        image4Scene.style.display = 'block';
        activeScene = 'image4';
        console.log('Active scene: image4');
      }
    }
    
    // Start with photo scene
    setActiveScene('photo');
    
    // Cycle through scenes every 3 seconds if no target found
    setInterval(() => {
      if (!targetFound && memoryModal.style.display !== 'flex' && cameraPermission) {
        sceneIndex = (sceneIndex + 1) % scenes.length;
        setActiveScene(scenes[sceneIndex]);
      }
    }, 3000);
    
    // Handle visibility change
    document.addEventListener('visibilitychange', () => {
      if (document.hidden && memoryModal.style.display === 'flex') {
        hideMemoryModal();
      }
    });
    
    // PDF Generation for A4 foldable booklet
    function generateBookletPDF() {
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF({
        orientation: 'portrait',
        unit: 'mm',
        format: 'a4'
      });
      
      const data = memoryData[currentTarget] || memoryData.photo;
      const pageWidth = 210; // A4 width in mm
      const pageHeight = 297; // A4 height in mm
      
      // A6 dimensions (folded size)
      const a6Width = 105; // Half of A4 width
      const a6Height = 148.5; // Quarter of A4 height
      
      // Panel positions (for 4 panels - front, inside left, inside right, back)
      const panels = [
        { x: 0, y: 0, width: a6Width, height: a6Height }, // Front cover
        { x: a6Width, y: 0, width: a6Width, height: a6Height }, // Inside left (signatures)
        { x: 0, y: a6Height, width: a6Width, height: a6Height }, // Inside right (more signatures)
        { x: a6Width, y: a6Height, width: a6Width, height: a6Height } // Back cover (memories)
      ];
      
      // Panel 1: Front cover - Portrait
      pdf.setFillColor(166, 180, 164); // #a6b4a4
      pdf.rect(panels[0].x, panels[0].y, panels[0].width, panels[0].height, 'F');
      
      pdf.setFontSize(16);
      pdf.setTextColor(255, 255, 255);
      pdf.text('My Memory Book', panels[0].x + 15, panels[0].y + 30);
      
      pdf.setFontSize(12);
      pdf.text(data.studentName, panels[0].x + 15, panels[0].y + 45);
      pdf.text('Class of 2024', panels[0].x + 15, panels[0].y + 60);
      
      // Draw portrait circle placeholder
      pdf.setDrawColor(255, 255, 255);
      pdf.setFillColor(255, 255, 255);
      pdf.circle(panels[0].x + a6Width/2, panels[0].y + a6Height/2 + 10, 25, 'FD');
      
      // Add note about AR trigger
      pdf.setFontSize(8);
      pdf.text('Scan the photo with', panels[0].x + 15, panels[0].y + a6Height - 20);
      pdf.text('Braiswick AR app', panels[0].x + 15, panels[0].y + a6Height - 15);
      
      // Panel 2: Inside left - Signatures panel 1
      pdf.setFillColor(245, 245, 245);
      pdf.rect(panels[1].x, panels[1].y, panels[1].width, panels[1].height, 'F');
      
      pdf.setTextColor(44, 62, 47); // #2c3e2f
      pdf.setFontSize(14);
      pdf.text('Friends Signatures', panels[1].x + 15, panels[1].y + 20);
      
      // Draw signature lines
      pdf.setDrawColor(166, 180, 164);
      pdf.setLineWidth(0.5);
      for (let i = 0; i < 6; i++) {
        pdf.line(panels[1].x + 15, panels[1].y + 40 + (i * 15), panels[1].x + a6Width - 15, panels[1].y + 40 + (i * 15));
      }
      
      // Panel 3: Inside right - Signatures panel 2
      pdf.setFillColor(245, 245, 245);
      pdf.rect(panels[2].x, panels[2].y, panels[2].width, panels[2].height, 'F');
      
      pdf.setTextColor(44, 62, 47);
      pdf.setFontSize(14);
      pdf.text('More Signatures', panels[2].x + 15, panels[2].y + 20);
      
      // Draw signature lines
      for (let i = 0; i < 6; i++) {
        pdf.line(panels[2].x + 15, panels[2].y + 40 + (i * 15), panels[2].x + a6Width - 15, panels[2].y + 40 + (i * 15));
      }
      
      // Panel 4: Back cover - Memories
      pdf.setFillColor(138, 154, 135); // #8a9a87
      pdf.rect(panels[3].x, panels[3].y, panels[3].width, panels[3].height, 'F');
      
      pdf.setTextColor(255, 255, 255);
      pdf.setFontSize(16);
      pdf.text('2024 Memories', panels[3].x + 15, panels[3].y + 25);
      
      pdf.setFontSize(12);
      pdf.text(`Favorite Thing:`, panels[3].x + 15, panels[3].y + 50);
      pdf.text(data.favoriteThing, panels[3].x + 15, panels[3].y + 65);
      
      pdf.text(`Favorite Subject:`, panels[3].x + 15, panels[3].y + 90);
      pdf.text(data.favoriteSubject, panels[3].x + 15, panels[3].y + 105);
      
      pdf.text(`Favorite Teacher:`, panels[3].x + 15, panels[3].y + 130);
      pdf.text(data.favoriteTeacher, panels[3].x + 15, panels[3].y + 145);
      
      pdf.text(`Best Friend:`, panels[3].x + 15, panels[3].y + 170);
      pdf.text(data.bestFriend, panels[3].x + 15, panels[3].y + 185);
      
      // Add AR trigger info
      pdf.setFontSize(8);
      pdf.text(`AR Trigger: ${data.photoFile}`, panels[3].x + 15, panels[3].y + a6Height - 15);
      
      // Add fold lines
      pdf.setDrawColor(200, 200, 200);
      pdf.setLineWidth(0.5);
      pdf.setLineDashPattern([5, 5], 0);
      
      // Vertical fold line (middle of A4)
      pdf.line(pageWidth/2, 0, pageWidth/2, pageHeight);
      
      // Horizontal fold line (middle of A4)
      pdf.line(0, pageHeight/2, pageWidth, pageHeight/2);
      
      // Save the PDF
      pdf.save(`${data.studentName.replace(/\s+/g, '_')}_memory_booklet.pdf`);
    }
    
    // Download button click handler
    downloadBtn.addEventListener('click', generateBookletPDF);
  </script>
</body>
</html>
