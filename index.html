<!DOCTYPE html>
<html>
<head>
  <title>Braiswick Memory Cards - Photo Booklet</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  
  <!-- Import libraries -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image.prod.js"></script>
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
  <!-- Add jsPDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  
  <style>
    /* (keep all your existing styles - they're perfect) */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: fixed;
      font-family: 'Arial', sans-serif;
    }
    
    /* Splash Screen */
    #splash-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #a6b4a4;
      z-index: 20000;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: opacity 0.8s ease;
    }
    
    #splash-screen.fade-out {
      opacity: 0;
      pointer-events: none;
    }
    
    .splash-logo {
      width: 280px;
      height: auto;
      animation: fadeInScale 1.2s ease-out;
    }
    
    @keyframes fadeInScale {
      0% {
        opacity: 0;
        transform: scale(0.9);
      }
      100% {
        opacity: 1;
        transform: scale(1);
      }
    }
    
    /* Camera permission button overlay */
    #camera-prompt {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #a6b4a4;
      z-index: 10000;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    
    .camera-prompt-content {
      text-align: center;
      max-width: 400px;
      padding: 20px;
    }
    
    .prompt-logo {
      width: 200px;
      height: auto;
      margin-bottom: 40px;
    }
    
    #camera-button {
      background: #2c3e2f;
      color: white;
      border: none;
      padding: 18px 50px;
      border-radius: 50px;
      font-size: 18px;
      font-weight: 500;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 10px 20px rgba(0,0,0,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      margin-top: 20px;
    }
    
    #camera-button:hover {
      background: #1e2b20;
      transform: translateY(-2px);
      box-shadow: 0 15px 30px rgba(0,0,0,0.15);
    }
    
    #camera-button:active {
      transform: translateY(0);
    }
    
    #permission-status {
      margin-top: 20px;
      color: #2c3e2f;
      font-size: 14px;
      font-weight: 500;
      opacity: 0.8;
    }
    
    .prompt-message {
      color: #2c3e2f;
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 20px;
      font-weight: 400;
      opacity: 0.9;
    }
    
    /* AR Scene */
    a-scene {
      position: absolute !important;
      top: 0 !important;
      left: 0 !important;
      width: 100% !important;
      height: 100% !important;
      z-index: 1 !important;
      display: block !important;
      opacity: 0;
      transition: opacity 0.5s;
    }
    
    a-scene.visible {
      opacity: 1;
    }
    
    /* UI Overlay */
    #ui-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1000;
      pointer-events: none;
    }
    
    .scan-container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 280px;
      height: 280px;
      z-index: 1001;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .scan-box {
      width: 100%;
      height: 100%;
      border: 2px solid rgba(255, 255, 255, 0.8);
      border-radius: 24px;
      box-shadow: 0 0 0 1000px rgba(0, 0, 0, 0.5);
      transition: all 0.3s ease;
    }
    
    .scan-box.detected {
      border-color: #a6b4a4;
      box-shadow: 0 0 30px #a6b4a4, 0 0 0 1000px rgba(166, 180, 164, 0.1);
    }
    
    /* Memory Card Modal */
    #memory-card-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 5000;
      display: none;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      align-items: center;
      justify-content: center;
      pointer-events: auto;
    }
    
    .memory-card-container {
      width: 320px;
      height: 500px;
      perspective: 1500px;
      cursor: pointer;
    }
    
    .memory-card {
      position: relative;
      width: 100%;
      height: 100%;
      text-align: center;
      transition: transform 0.8s;
      transform-style: preserve-3d;
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
    }
    
    .memory-card.flipped {
      transform: rotateY(180deg);
    }
    
    .card-front, .card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 24px;
      overflow: hidden;
    }
    
    .card-front {
      background: linear-gradient(145deg, #ffffff 0%, #f5f5f5 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    
    .portrait-frame {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      overflow: hidden;
      border: 4px solid #a6b4a4;
      margin-bottom: 30px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.1);
      background-color: #e0e0e0;
    }
    
    .portrait-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    
    .view-memory-btn {
      background: #2c3e2f;
      color: white;
      border: none;
      padding: 15px 40px;
      border-radius: 50px;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 10px 20px rgba(0,0,0,0.1);
      border: 1px solid rgba(255,255,255,0.2);
    }
    
    .view-memory-btn:hover {
      background: #1e2b20;
      transform: translateY(-2px);
      box-shadow: 0 15px 30px rgba(0,0,0,0.15);
    }
    
    .card-back {
      background: linear-gradient(135deg, #a6b4a4 0%, #8a9a87 100%);
      transform: rotateY(180deg);
      padding: 25px;
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    
    .memory-header {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 20px;
      border-bottom: 2px solid rgba(255,255,255,0.3);
      padding-bottom: 10px;
    }
    
    .memory-details {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 20px;
      justify-content: center;
    }
    
    .memory-item {
      text-align: left;
    }
    
    .memory-label {
      font-size: 14px;
      opacity: 0.8;
      margin-bottom: 5px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    
    .memory-value {
      font-size: 20px;
      font-weight: 600;
      line-height: 1.4;
    }
    
    .memory-footer {
      font-size: 12px;
      opacity: 0.6;
      margin-top: 20px;
      font-style: italic;
    }
    
    /* Download Button */
    #download-btn-container {
      position: absolute;
      bottom: 30px;
      left: 30px;
      z-index: 5001;
      pointer-events: auto;
      display: none;
    }
    
    #download-btn-container.visible {
      display: block;
    }
    
    .download-btn {
      background: #2c3e2f;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 50px;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
      border: 1px solid rgba(255,255,255,0.2);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .download-btn:hover {
      background: #1e2b20;
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(0,0,0,0.25);
    }
    
    .download-icon {
      font-size: 18px;
    }
    
    #close-modal-btn {
      position: absolute;
      top: 50px;
      right: 20px;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: white;
      font-size: 30px;
      line-height: 1;
      cursor: pointer;
      pointer-events: auto;
      transition: all 0.3s ease;
      z-index: 5001;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(5px);
    }
    
    #close-modal-btn:hover {
      background: rgba(255, 255, 255, 0.3);
      transform: scale(1.1);
    }
    
    /* Loading indicator */
    #loading {
      position: fixed;
      bottom: 30px;
      right: 30px;
      color: rgba(255, 255, 255, 0.7);
      font-size: 12px;
      letter-spacing: 0.5px;
      z-index: 10000;
      text-transform: uppercase;
    }
    
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.02); }
      100% { transform: scale(1); }
    }
    
    .pulse {
      animation: pulse 1s ease-in-out;
    }
  </style>
</head>
<body>
  <!-- All your existing HTML structure stays exactly the same -->
  <div id="splash-screen">
    <img src="https://static.wixstatic.com/media/42e05c_12592fc2a93e4bf0b1e30417fc3a3694~mv2.png" alt="Braiswick" class="splash-logo">
  </div>

  <div id="camera-prompt">
    <div class="camera-prompt-content">
      <img src="https://static.wixstatic.com/media/42e05c_12592fc2a93e4bf0b1e30417fc3a3694~mv2.png" alt="Braiswick" class="prompt-logo">
      <div class="prompt-message">Enable camera access to discover memories</div>
      <button id="camera-button">Continue</button>
      <div id="permission-status"></div>
    </div>
  </div>

  <div id="download-btn-container">
    <button class="download-btn" id="downloadBookletBtn">
      <span class="download-icon">📖</span>
      <span>Download Photo Booklet</span>
    </button>
  </div>

  <div id="memory-card-modal">
    <div class="memory-card-container" id="memoryCardContainer">
      <div class="memory-card" id="memoryCard">
        <div class="card-front">
          <div class="portrait-frame">
            <img src="" alt="Student Portrait" id="studentPortrait">
          </div>
          <button class="view-memory-btn" id="viewMemoryBtn">View Memory</button>
        </div>
        <div class="card-back">
          <div class="memory-header">2024 Memories</div>
          <div class="memory-details">
            <div class="memory-item">
              <div class="memory-label">Favorite Thing This Year</div>
              <div class="memory-value" id="favoriteThing">Art Class</div>
            </div>
            <div class="memory-item">
              <div class="memory-label">Favorite Subject</div>
              <div class="memory-value" id="favoriteSubject">Science</div>
            </div>
            <div class="memory-item">
              <div class="memory-label">Favorite Teacher</div>
              <div class="memory-value" id="favoriteTeacher">Mrs. Smith</div>
            </div>
            <div class="memory-item">
              <div class="memory-label">Best Friend</div>
              <div class="memory-value" id="bestFriend">Alex</div>
            </div>
          </div>
          <div class="memory-footer">Braiswick • Class of 2024</div>
        </div>
      </div>
    </div>
    <button id="close-modal-btn">✕</button>
  </div>

  <!-- AR Scene elements (keep all your existing a-scene tags) -->
  <a-scene
    id="scene-photo"
    mindar-image="imageTargetSrc: ./photo.mind; autoStart: true; uiLoading: no; uiError: no; uiScanning: no;"
    color-space="sRGB"
    embedded
    renderer="colorManagement: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    style="display: none;">
    <a-camera id="camera-photo" position="0 0 0" look-controls="enabled: false"></a-camera>
    <a-entity id="photo-target" mindar-image-target="targetIndex: 0">
      <a-plane width="2.0" height="1.33" position="0 0.5 0" rotation="0 0 0" material="transparent: true; opacity: 0;"></a-plane>
    </a-entity>
  </a-scene>

  <!-- ... (keep all other a-scene elements for image1, image2, image4) ... -->
  
  <a-scene
    id="scene-image1"
    mindar-image="imageTargetSrc: ./image1.mind; autoStart: true; uiLoading: no; uiError: no; uiScanning: no;"
    color-space="sRGB"
    embedded
    renderer="colorManagement: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    style="display: none;">
    <a-camera id="camera-image1" position="0 0 0" look-controls="enabled: false"></a-camera>
    <a-entity id="image1-target" mindar-image-target="targetIndex: 0">
      <a-plane width="2.0" height="1.33" position="0 0.5 0" rotation="0 0 0" material="transparent: true; opacity: 0;"></a-plane>
    </a-entity>
  </a-scene>

  <a-scene
    id="scene-image2"
    mindar-image="imageTargetSrc: ./image2.mind; autoStart: true; uiLoading: no; uiError: no; uiScanning: no;"
    color-space="sRGB"
    embedded
    renderer="colorManagement: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    style="display: none;">
    <a-camera id="camera-image2" position="0 0 0" look-controls="enabled: false"></a-camera>
    <a-entity id="image2-target" mindar-image-target="targetIndex: 0">
      <a-plane width="2.0" height="1.33" position="0 0.5 0" rotation="0 0 0" material="transparent: true; opacity: 0;"></a-plane>
    </a-entity>
  </a-scene>

  <a-scene
    id="scene-image4"
    mindar-image="imageTargetSrc: ./image4.mind; autoStart: true; uiLoading: no; uiError: no; uiScanning: no;"
    color-space="sRGB"
    embedded
    renderer="colorManagement: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    style="display: none;">
    <a-camera id="camera-image4" position="0 0 0" look-controls="enabled: false"></a-camera>
    <a-entity id="image4-target" mindar-image-target="targetIndex: 0">
      <a-plane width="2.0" height="1.33" position="0 0.5 0" rotation="0 0 0" material="transparent: true; opacity: 0;"></a-plane>
    </a-entity>
  </a-scene>

  <div id="ui-overlay">
    <div class="scan-container">
      <div class="scan-box" id="scanBox"></div>
    </div>
  </div>
  
  <div id="loading">initializing</div>

  <script>
    // All your existing JavaScript setup (UI Elements, memoryData, etc.) stays exactly the same
    // UI Elements
    const splashScreen = document.getElementById('splash-screen');
    const scanBox = document.getElementById('scanBox');
    const loadingEl = document.getElementById('loading');
    const cameraPrompt = document.getElementById('camera-prompt');
    const cameraButton = document.getElementById('camera-button');
    const permissionStatus = document.getElementById('permission-status');
    
    // Memory Card Elements
    const memoryModal = document.getElementById('memory-card-modal');
    const memoryCard = document.getElementById('memoryCard');
    const viewMemoryBtn = document.getElementById('viewMemoryBtn');
    const closeModalBtn = document.getElementById('close-modal-btn');
    
    // Memory data elements
    const studentPortrait = document.getElementById('studentPortrait');
    const favoriteThing = document.getElementById('favoriteThing');
    const favoriteSubject = document.getElementById('favoriteSubject');
    const favoriteTeacher = document.getElementById('favoriteTeacher');
    const bestFriend = document.getElementById('bestFriend');
    
    // Download button
    const downloadBtnContainer = document.getElementById('download-btn-container');
    const downloadBtn = document.getElementById('downloadBookletBtn');
    
    // Scene elements
    const photoScene = document.getElementById('scene-photo');
    const image1Scene = document.getElementById('scene-image1');
    const image2Scene = document.getElementById('scene-image2');
    const image4Scene = document.getElementById('scene-image4');
    const allScenes = [photoScene, image1Scene, image2Scene, image4Scene];
    
    // Memory data for different targets
    const memoryData = {
      photo: {
        studentName: 'Student Name',
        portrait: './photo1.jpg',
        favoriteThing: 'Art Class',
        favoriteSubject: 'Science',
        favoriteTeacher: 'Mrs. Smith',
        bestFriend: 'Alex',
        mindFile: 'photo.mind',
        photoFile: 'photo1.jpg',
        schoolYear: '2024',
        class: 'Year 3'
      },
      image1: {
        studentName: 'Emma',
        portrait: './photo1.jpg',
        favoriteThing: 'Music Lessons',
        favoriteSubject: 'Math',
        favoriteTeacher: 'Mr. Johnson',
        bestFriend: 'Olivia',
        mindFile: 'image1.mind',
        photoFile: 'photo1.jpg',
        schoolYear: '2024',
        class: 'Year 3'
      },
      image2: {
        studentName: 'James',
        portrait: './photo2.jpg',
        favoriteThing: 'Sports Day',
        favoriteSubject: 'Physical Education',
        favoriteTeacher: 'Coach Roberts',
        bestFriend: 'William',
        mindFile: 'image2.mind',
        photoFile: 'photo2.jpg',
        schoolYear: '2024',
        class: 'Year 4'
      },
      image4: {
        studentName: 'Sophie',
        portrait: './photo4.jpg',
        favoriteThing: 'Reading Time',
        favoriteSubject: 'English',
        favoriteTeacher: 'Ms. Davis',
        bestFriend: 'Isabella',
        mindFile: 'image4.mind',
        photoFile: 'photo4.jpg',
        schoolYear: '2024',
        class: 'Year 5'
      }
    };
    
    let activeScene = 'photo';
    let targetFound = false;
    let cameraPermission = false;
    let currentTarget = 'photo';
    
    // Fade out splash screen
    setTimeout(() => {
      splashScreen.classList.add('fade-out');
    }, 2000);
    
    // Camera permission
    const isInIframe = window.self !== window.top;
    
    async function requestCameraPermission() {
      permissionStatus.innerHTML = 'Requesting camera access...';
      cameraButton.disabled = true;
      cameraButton.innerHTML = 'Requesting...';
      
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ 
          video: {
            width: { ideal: 1280 },
            height: { ideal: 720 },
            facingMode: 'environment'
          },
          audio: false 
        });
        
        stream.getTracks().forEach(track => track.stop());
        
        cameraPermission = true;
        cameraPrompt.style.display = 'none';
        
        allScenes.forEach(scene => {
          scene.classList.add('visible');
        });
        
        loadingEl.innerHTML = 'scanning';
        
        return true;
        
      } catch (error) {
        console.error('Camera error:', error);
        
        let userMessage = error.name === 'NotAllowedError' 
          ? 'Camera access required. Please enable and try again.'
          : 'Unable to access camera. Please try again.';
        
        permissionStatus.innerHTML = userMessage;
        cameraButton.disabled = false;
        cameraButton.innerHTML = 'Try Again';
        
        return false;
      }
    }
    
    cameraButton.addEventListener('click', requestCameraPermission);
    
    if (!isInIframe) {
      setTimeout(requestCameraPermission, 2500);
    }
    
    // Function to update memory card with target data
    function updateMemoryCard(target) {
      const data = memoryData[target] || memoryData.photo;
      
      studentPortrait.src = data.portrait;
      studentPortrait.alt = `${data.studentName}'s portrait`;
      
      studentPortrait.onerror = function() {
        console.log('Error loading image:', data.portrait);
        this.src = 'https://static.wixstatic.com/media/42e05c_12592fc2a93e4bf0b1e30417fc3a3694~mv2.png';
      };
      
      favoriteThing.textContent = data.favoriteThing;
      favoriteSubject.textContent = data.favoriteSubject;
      favoriteTeacher.textContent = data.favoriteTeacher;
      bestFriend.textContent = data.bestFriend;
    }
    
    // Function to show memory modal
    function showMemoryModal(target) {
      if (memoryModal.style.display === 'flex') return;
      
      updateMemoryCard(target);
      currentTarget = target;
      memoryModal.style.display = 'flex';
      downloadBtnContainer.classList.add('visible');
      memoryCard.classList.remove('flipped');
      scanBox.classList.add('detected');
      scanBox.classList.add('pulse');
    }
    
    // Function to hide memory modal
    function hideMemoryModal() {
      memoryModal.style.display = 'none';
      memoryCard.classList.remove('flipped');
      downloadBtnContainer.classList.remove('visible');
    }
    
    closeModalBtn.addEventListener('click', hideMemoryModal);
    
    memoryModal.addEventListener('click', (e) => {
      if (e.target === memoryModal) {
        hideMemoryModal();
      }
    });
    
    viewMemoryBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      memoryCard.classList.add('flipped');
    });
    
    memoryCard.addEventListener('click', () => {
      memoryCard.classList.toggle('flipped');
    });
    
    function setupSceneListeners(scene, targetName) {
      scene.addEventListener('targetFound', () => {
        targetFound = true;
        showMemoryModal(targetName);
      });
      
      scene.addEventListener('targetLost', () => {
        if (memoryModal.style.display !== 'flex') {
          targetFound = false;
          scanBox.classList.remove('detected');
          scanBox.classList.remove('pulse');
        }
      });
    }
    
    setupSceneListeners(photoScene, 'photo');
    setupSceneListeners(image1Scene, 'image1');
    setupSceneListeners(image2Scene, 'image2');
    setupSceneListeners(image4Scene, 'image4');
    
    photoScene.addEventListener('loaded', () => {
      loadingEl.innerHTML = 'ready';
    });
    
    let sceneIndex = 0;
    const scenes = ['photo', 'image1', 'image2', 'image4'];
    
    function setActiveScene(sceneName) {
      if (memoryModal.style.display === 'flex') return;
      
      photoScene.style.display = 'none';
      image1Scene.style.display = 'none';
      image2Scene.style.display = 'none';
      image4Scene.style.display = 'none';
      
      if (sceneName === 'photo') {
        photoScene.style.display = 'block';
        activeScene = 'photo';
      } else if (sceneName === 'image1') {
        image1Scene.style.display = 'block';
        activeScene = 'image1';
      } else if (sceneName === 'image2') {
        image2Scene.style.display = 'block';
        activeScene = 'image2';
      } else if (sceneName === 'image4') {
        image4Scene.style.display = 'block';
        activeScene = 'image4';
      }
    }
    
    setActiveScene('photo');
    
    setInterval(() => {
      if (!targetFound && memoryModal.style.display !== 'flex' && cameraPermission) {
        sceneIndex = (sceneIndex + 1) % scenes.length;
        setActiveScene(scenes[sceneIndex]);
      }
    }, 3000);
    
    document.addEventListener('visibilitychange', () => {
      if (document.hidden && memoryModal.style.display === 'flex') {
        hideMemoryModal();
      }
    });

    // ===== SIMPLIFIED PDF GENERATION USING YOUR JPG TEMPLATE =====
    
    // Function to load image
    function loadImage(src) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = () => resolve(img);
        img.onerror = reject;
        img.src = src;
      });
    }
    
    // Function to rotate image 90 degrees clockwise
    function rotateImage(img) {
      return new Promise((resolve) => {
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        
        canvas.width = img.height;
        canvas.height = img.width;
        
        ctx.translate(canvas.width/2, canvas.height/2);
        ctx.rotate(90 * Math.PI/180);
        ctx.drawImage(img, -img.width/2, -img.height/2);
        
        canvas.toBlob((blob) => {
          const url = URL.createObjectURL(blob);
          const rotatedImg = new Image();
          rotatedImg.onload = () => {
            URL.revokeObjectURL(url);
            resolve(rotatedImg);
          };
          rotatedImg.src = url;
        }, 'image/jpeg', 0.95);
      });
    }
    
    // PDF GENERATION - Using your JPG template
    async function generateBookletPDF() {
      try {
        // Get current student data
        const data = memoryData[currentTarget] || memoryData.photo;
        
        // Show loading message
        loadingEl.innerHTML = 'generating PDF...';
        
        // Load the student photo
        const photoImg = await loadImage(data.portrait);
        
        // Rotate photo 90 degrees clockwise (as you requested)
        const rotatedPhoto = await rotateImage(photoImg);
        
        // Load your beautiful JPG template
        const templateImg = await loadImage('https://static.wixstatic.com/media/42e05c_f053990bf15d491cbaecd492cd2ba669~mv2.jpg');
        
        // Create a new PDF - A4 PORTRAIT at 300 DPI
        const doc = new jspdf.jsPDF({
          orientation: 'portrait',
          unit: 'px',
          format: [2480, 3508] // 300 DPI A4
        });
        
        // Add your template as the background
        doc.addImage(templateImg, 'JPEG', 0, 0, 2480, 3508);
        
        // Convert rotated photo to data URL
        const photoCanvas = document.createElement('canvas');
        photoCanvas.width = rotatedPhoto.width;
        photoCanvas.height = rotatedPhoto.height;
        const photoCtx = photoCanvas.getContext('2d');
        photoCtx.drawImage(rotatedPhoto, 0, 0);
        const photoDataUrl = photoCanvas.toDataURL('image/jpeg', 0.95);
        
        // Add the student photo at the exact coordinates you specified
        // Left: 196px, Top: 1058px, Width: 634px, Height: 503px
        doc.addImage(photoDataUrl, 'JPEG', 196, 1058, 634, 503);
        
        // Add subtle cut guides (optional - you can remove these if you prefer)
        doc.setDrawColor(200, 200, 200);
        doc.setLineWidth(1);
        
        // Vertical cut line (middle)
        doc.line(1240, 0, 1240, 3508);
        
        // Horizontal cut lines
        for (let i = 1; i < 4; i++) {
          doc.line(0, i * 877, 2480, i * 877);
        }
        
        // Add panel numbers for easy assembly (optional)
        doc.setFontSize(20);
        doc.setTextColor(150, 150, 150);
        
        let panelNum = 1;
        for (let row = 0; row < 4; row++) {
          for (let col = 0; col < 2; col++) {
            const x = col * 1240 + 50;
            const y = row * 877 + 50;
            doc.text(panelNum.toString(), x, y);
            panelNum++;
          }
        }
        
        // Add simple instructions
        doc.setFontSize(24);
        doc.setTextColor(100, 100, 100);
        doc.text('www.braiswick.co.uk.', 200, 3400);
        
        // Save the PDF
        doc.save(`${data.studentName}_Photo_Booklet.pdf`);
        
        loadingEl.innerHTML = 'ready';
        alert('PDF generated successfully! Your PDF will download automatically.');
        
      } catch (error) {
        console.error('PDF Error:', error);
        loadingEl.innerHTML = 'error';
        alert('Error generating PDF: ' + error.message);
      }
    }
    
    downloadBtn.addEventListener('click', generateBookletPDF);
  </script>
